{% extends "layout.html" %}
{% block title %}Data Page{% endblock %}
{% block head %}
{{ super() }}

<link rel="stylesheet" href="{{ url_for('static', filename='css/orderFormStyles.css') }}">
<style type="text/css">
  .important {
    color: #336699;
  }

  .form-control {
    display: inline-block;
    width: auto;
  }
</style>
{% endblock %}

{% block content %}
  <h3>Data Import</h3>
  <br>
  <form action="import_data" method="post" id="newDataSource" enctype="multipart/form-data">
    <p style="display: inline; padding-right: 3.15cm;">What data would you like to import?</p>
    <select name="corresponding-table" title="Choose target dataset">
      <option value="" selected disabled hidden>Choose data here...</option>
      <option value="products">Products</option>
      <option value="customers">Customers</option>
      <option value="orders">Orders</option>
    </select>
    <br>
    <p style="display: inline; padding-right: 1.43cm;">Please select the file you would like to import.</p>
    <input type="file" name="upload-file" id="upload-file" class="btn btn-primary form-control" value="" title="Select File">
    <br>
    <br>
    <input type="hidden" name="submit-file" value="Submit">
    <button type="submit" class="btn btn-primary">Import Data</button>
  </form>
  <br>
{% endblock %}
